<script>
(function(){
  function pad(n){return n<10?'0'+n:''+n;}
  function tick(){
    var now=new Date();
    var d=document.getElementById('gw-date');
    var t=document.getElementById('gw-time');
    if(d)d.textContent=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
    if(t)t.textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  tick();setInterval(tick,1000);

  // Toast bildirimi — alert yerine, ekranı dondurmaz
  function gwToast(msg){
    var old=document.getElementById('gw-toast');if(old)old.remove();
    var t=document.createElement('div');t.id='gw-toast';t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){t.style.transition='opacity 0.4s';t.style.opacity='0';setTimeout(function(){t.remove();},400);},2200);
  }

  // Pırlanta Mührü — tepede tooltip + ışık bağı + 2.5sn delay modal
  var gwTipTimer=null;var gwModalTimer=null;var gwTipShowing=false;
  function showGwTip(btn){
    if(gwTipShowing)return;
    gwTipShowing=true;
    document.getElementById('gw-tip')&&document.getElementById('gw-tip').remove();
    document.getElementById('gw-beam')&&document.getElementById('gw-beam').remove();
    document.querySelectorAll('.gw-spark').forEach(function(s){s.remove();});
    var r=btn.getBoundingClientRect();
    var bx=r.left+r.width/2;var by=r.top;
    var tipTop=80;
    // Işık bağı (ışın)
    var beam=document.createElement('div');beam.id='gw-beam';
    var beamH=by-tipTop-60;
    beam.style.cssText='top:'+(tipTop+60)+'px;height:0;--beam-h:'+beamH+'px;';
    document.body.appendChild(beam);
    // Tooltip tepede
    var tip=document.createElement('div');tip.id='gw-tip';
    var GWT={TR:['💎 AYRICALIKLI DÜNYAYA GİRİŞ YAP 💎','Ayrıcalıklı üyeliğiniz sizi bekliyor...'],EN:['💎 ENTER THE EXCLUSIVE WORLD 💎','Your exclusive membership awaits...'],DE:['💎 EXKLUSIVE WELT BETRETEN 💎','Ihre exklusive Mitgliedschaft wartet...'],ES:['💎 ENTRAR AL MUNDO EXCLUSIVO 💎','Tu membresía exclusiva te espera...'],FR:['💎 ENTRER DANS LE MONDE EXCLUSIF 💎','Votre adhésion exclusive vous attend...'],RU:['💎 ВОЙТИ В МИР ПРИВИЛЕГИЙ 💎','Ваше эксклюзивное членство ждёт...'],UKR:['💎 ЕКСКЛЮЗИВНИЙ ВХІД 💎','Ваше ексклюзивне членство чекає...'],CN:['💎 进入尊享世界 💎','您的尊享会员资格正在等待...'],AR:['💎 ادخل إلى العالم الحصري 💎','عضويتك الحصرية بانتظارك...']};
    var cl=gwGetLang();var gwtx=GWT[cl]||GWT['TR'];
    tip.innerHTML='<div id="gw-tip-txt">'+gwtx[0]+'</div><div id="gw-tip-sub">'+gwtx[1]+'</div>';
    document.body.appendChild(tip);
    // Altın aura
    document.getElementById('gw-aura')&&document.getElementById('gw-aura').remove();
    var aura=document.createElement('div');aura.id='gw-aura';document.body.appendChild(aura);
    setTimeout(function(){aura.remove();},1000);
    // Pırlanta sesi (Web Audio API)
    try{
      var ac=new(window.AudioContext||window.webkitAudioContext)();
      var freqs=[2093,2637,3136,4186];
      freqs.forEach(function(f,i){
        setTimeout(function(){
          var o=ac.createOscillator();var g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);
          g.gain.setValueAtTime(0.15,ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);
          o.start();o.stop(ac.currentTime+0.4);
        },i*60);
      });
    }catch(e){}
    // Kıvılcımlar tepede
    var sparks=['💎','✦','◆','✧','◇','★'];
    for(var i=0;i<8;i++){
      (function(i){setTimeout(function(){
        var sp=document.createElement('div');sp.className='gw-spark';
        sp.textContent=sparks[i%sparks.length];
        var sx=window.innerWidth/2+(Math.random()-0.5)*200;
        var sy=60+Math.random()*60;
        sp.style.cssText='left:'+sx+'px;top:'+sy+'px;font-size:'+(8+Math.random()*10)+'px;color:#ffd700;text-shadow:0 0 8px #ffd700;';
        document.body.appendChild(sp);
        setTimeout(function(){sp.remove();},1000);
      },i*100);})(i);
    }
    // 2.5 sn sonra modal aç
    // Tooltip'e dokunulunca hemen aç (mobil), masaüstünde 2.5sn
    var delay=window.innerWidth>768?2500:(window.innerHeight>window.innerWidth?3000:4500);
    clearTimeout(gwModalTimer);
    gwModalTimer=setTimeout(function(){
      document.getElementById('gw-tip')&&document.getElementById('gw-tip').remove();

      var dist=0;
      var lastT=null;
      var PPS=50; // pixel/saniye
      function scroll(ts){
        if(!lastT)lastT=ts;
        var dt=(ts-lastT)/1000;
        lastT=ts;
        if(dt>0.1)dt=0.1; // sekme arka plana geçerse spike olmasın
        dist+=PPS*dt;
        if(half>0&&dist>=half)dist=dist-half;
        inn.style.transform='translate3d(-'+dist+'px,0,0)';

    RU:['Главная','Обзор','Барберы','Парикмахеры','Массаж','Макияж','Ногти','Курсы','Работа','Карта','Эфир','Сообщения','Профиль','Настройки'],
    UKR:['Головна','Огляд','Перукарі','Стилісти','Масаж','Макіяж','Нігті','Навчання','Вакансії','Карта','Ефір','Повідомлення','Профіль','Налаштування']
  };
  var GW_CURRLANG='TR';
  function gwGetLang(){
    // Navbar'daki dil butonundan kodu oku
    var spans=document.querySelectorAll('.navbar span');
    for(var i=0;i<spans.length;i++){
      var t=spans[i].textContent.trim();
      if(GW_LABELS[t])return t;
    }
    return GW_CURRLANG;
  }
  function gwRefreshLabels(){
    var bar=document.getElementById('gw-hbar');
    if(!bar)return;
    var lang=gwGetLang();
    if(lang===GW_CURRLANG&&bar.dataset.lang===lang)return;
    GW_CURRLANG=lang;
    bar.dataset.lang=lang;
    var items=bar.querySelectorAll('.gw-hi .gw-lbl');
    var labels=GW_LABELS[lang]||GW_LABELS['TR'];
    items.forEach(function(sp,i){if(labels[i])sp.textContent=labels[i];});
  }
  var GW_CATS=GW_LABELS['TR'];
  function gwBuildHBar(){
    if(window.innerWidth<=768){var b=document.getElementById('gw-hbar');if(b)b.style.display='none';return;}
    if(document.getElementById('gw-hbar')){document.getElementById('gw-hbar').style.display='flex';return;}
    var navbar=document.querySelector('.navbar');
    if(!navbar){setTimeout(gwBuildHBar,200);return;}
    var bar=document.createElement('div');
    bar.id='gw-hbar';
    bar.style.cssText='display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 28px;height:48px;background:rgba(6,5,12,0.97);border-bottom:1px solid rgba(201,162,39,0.18);position:sticky;top:'+(navbar.offsetHeight)+'px;z-index:990;';
    var style=document.createElement('style');
    style.textContent='#gw-hbar::-webkit-scrollbar{display:none}'
     +'@keyframes gw-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.2)}}'
     +'.gw-hi{position:relative;padding:0 18px;height:48px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:DM Sans,sans-serif;font-size:15px;font-weight:600;color:rgba(220,210,195,0.92);letter-spacing:0.4px;white-space:nowrap;transition:color 0.2s;flex-shrink:0}'
     +'.gw-hi::after{content:"";position:absolute;bottom:0;left:15px;right:15px;height:2px;background:linear-gradient(90deg,transparent,#c9a227,#ffd700,#c9a227,transparent);opacity:0;transition:opacity 0.2s}'
     +'.gw-hi:hover{color:#ffd700}.gw-hi:hover::after{opacity:1}'
     +'.gw-hi.gw-act{color:#ffd700;font-weight:700}.gw-hi.gw-act::after{opacity:1}'
     +'.gw-dia{font-size:11px;opacity:0.25;transition:opacity 0.2s}'
     +'.gw-hi.gw-act .gw-dia{opacity:1;animation:gw-pulse 1.5s ease infinite;filter:drop-shadow(0 0 4px #ffd700)}'
     +'.gw-hi:hover .gw-dia{opacity:0.7}';
    document.head.appendChild(style);
    bar.dataset.lang='TR';
    GW_CATS.forEach(function(lbl,i){
      var d=document.createElement('div');
      d.className='gw-hi';
      d.dataset.idx=i;
      d.innerHTML='<span class="gw-dia">💎</span><span class="gw-lbl">'+lbl+'</span>';
      d.onclick=function(){
        var idx=parseInt(this.dataset.idx);
        var sbi=document.querySelectorAll('.sbi');
        if(sbi[idx])sbi[idx].click();
        bar.querySelectorAll('.gw-hi').forEach(function(el){el.classList.remove('gw-act');});
        this.classList.add('gw-act');
      };
      bar.appendChild(d);
    });
    navbar.insertAdjacentElement('afterend',bar);
  }
  new MutationObserver(function(){if(!document.getElementById('gw-hbar')&&window.innerWidth>768)gwBuildHBar();}).observe(document.body,{childList:true,subtree:false});
  // Dil değişimini güvenli izle
  setInterval(gwRefreshLabels,800);
  setTimeout(gwBuildHBar,500);
  window.addEventListener('resize',function(){gwBuildHBar();});
  // ── YATAY MENÜ SONU v4 ─────────────────────────────────

  // Dil menüsü dışarı tık + Android geri kapama
  var overlay=document.createElement('div');
  overlay.style.cssText='display:none;position:fixed;inset:0;z-index:999;background:transparent;';
  document.body.appendChild(overlay);

  function closeLangMenu(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd){dd.click();}
    overlay.style.display='none';
    window._langOpen=false;
  }

  overlay.addEventListener('click',function(){closeLangMenu();});

  window.addEventListener('popstate',function(){
    if(window._langOpen){closeLangMenu();}
  });

  new MutationObserver(function(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd&&!window._langOpen){
      window._langOpen=true;
      overlay.style.display='block';
      history.pushState(null,'',location.href);
    } else if(!dd&&window._langOpen){
      window._langOpen=false;
      overlay.style.display='none';
    }
  }).observe(document.body,{childList:true,subtree:true});

  // ── PIRLANTA KABUL TÖRENİ ──────────────────────────────
  function gwFireConfetti(){
    var colors=['#ffd700','#fffacd','#c9a227','#fff','#b8860b','#f0e68c'];
    var emojis=['💎','✦','◆','✧','★'];
    for(var i=0;i<70;i++){
      (function(idx){
        setTimeout(function(){
          var p=document.createElement('div');
          var isEmoji=idx%6===0;
          var col=colors[Math.floor(Math.random()*colors.length)];
          var tx=(Math.random()-0.5)*window.innerWidth*0.9;
          var ty=-(80+Math.random()*window.innerHeight*0.7);
          var rot=(Math.random()*720-360)+'deg';
          p.style.cssText='position:fixed;left:50%;top:50%;pointer-events:none;z-index:1000001;transition:transform 2s cubic-bezier(0.25,0.46,0.45,0.94),opacity 2s ease;transform:translate(-50%,-50%);opacity:1;'+(isEmoji?'font-size:'+(10+Math.random()*16)+'px;color:'+col+';':'width:'+(3+Math.random()*5)+'px;height:'+(5+Math.random()*12)+'px;background:'+col+';border-radius:2px;');
          if(isEmoji)p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
          document.body.appendChild(p);
          requestAnimationFrame(function(){requestAnimationFrame(function(){
            p.style.transform='translate(calc(-50% + '+tx+'px),calc(-50% + '+ty+'px)) rotate('+rot+')';
            p.style.opacity='0';
          });});
          setTimeout(function(){p.remove();},2200);
        },idx*18);
      })(i);
    }
  }
  function gwPlayCrystalSound(){
    try{
      var ac=new(window.AudioContext||window.webkitAudioContext)();
      [1047,1319,1568,2093,2637,3136,4186].forEach(function(f,i){
        setTimeout(function(){
          var o=ac.createOscillator();var g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);
          g.gain.setValueAtTime(0.18,ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.7);
          o.start();o.stop(ac.currentTime+0.7);
        },i*90);
      });
    }catch(e){}
  }
  function gwStartCeremony(){
    if(document.getElementById('gw-ceremony'))return;
    gwPlayCrystalSound();
    gwFireConfetti();
    var tier=document.body.dataset.gwCeremonyTier||'diamond';
    var tierLabel=tier==='diamond'?'💎 PIRLANTA ÜYESİ':'🥈 GÜMÜŞ ÜYESİ';
    var ov=document.createElement('div');
    ov.id='gw-ceremony';
    ov.style.cssText='position:fixed;inset:0;z-index:999998;background:linear-gradient(135deg,rgba(0,0,0,0.96),rgba(6,4,1,0.98));display:flex;flex-direction:column;align-items:center;justify-content:center;animation:gw-cer-in 0.5s ease forwards;';
    ov.innerHTML=
      '<div style="text-align:center;padding:20px 30px;">'
      +'<div style="font-size:clamp(9px,2vw,13px);color:rgba(201,162,39,0.6);letter-spacing:8px;font-family:DM Sans,sans-serif;margin-bottom:18px;animation:gw-cer-title 0.6s 0.2s ease both;">GLAMWORLD</div>'
      +'<div style="font-size:clamp(20px,5vw,52px);font-weight:900;color:#ffd700;letter-spacing:3px;font-family:Cormorant Garamond,Georgia,serif;animation:gw-welcome-glow 2s ease-in-out infinite,gw-cer-title 0.7s 0.4s ease both;opacity:0;animation-fill-mode:forwards,both;">HOŞ GELDİNİZ</div>'
      +'<div style="font-size:clamp(8px,2vw,13px);color:rgba(201,162,39,0.5);letter-spacing:4px;font-family:DM Sans,sans-serif;margin-top:14px;animation:gw-cer-title 0.6s 0.8s ease both;">'+tierLabel+'</div>'
      +'<div style="font-size:clamp(48px,18vw,110px);animation:gw-seal-drop 0.7s 1s cubic-bezier(0.34,1.56,0.64,1) both;margin:24px 0 10px;">💎</div>'
      +'<div style="font-size:clamp(10px,2.5vw,16px);font-weight:900;letter-spacing:5px;color:#ffd700;animation:gw-stamp-in 0.5s 1.6s ease both;font-family:DM Sans,sans-serif;border:1.5px solid rgba(201,162,39,0.6);padding:6px 20px;border-radius:4px;">✓ ONAYLANDI</div>'
      +'</div>';
    document.body.appendChild(ov);
    setTimeout(function(){
      ov.style.animation='gw-cer-out 0.8s ease forwards';
      setTimeout(function(){ov.remove();delete document.body.dataset.gwCeremonyTier;},800);
    },3200);
  }
  // Kayıt butonu algılama
  var gwRegKeywords=['kayıt ol','sign up','register','create account','üye ol','katıl','konto erstellen','inscribirse','зарегистр','реєстр','créer'];
  document.addEventListener('click',function(e){
    var el=e.target;
    for(var i=0;i<5;i++){
      if(!el||el===document.body)break;
      if(el.tagName==='BUTTON'||el.tagName==='A'){
        var txt=(el.textContent||'').toLowerCase().trim();
        for(var j=0;j<gwRegKeywords.length;j++){
          if(txt.indexOf(gwRegKeywords[j])>=0){
            var tier=document.body.dataset.gwTier||gwTierActive||'diamond';
            document.body.dataset.gwCeremonyTier=tier;
            setTimeout(gwStartCeremony,400);
            return;
          }
        }
      }
      el=el.parentNode;
    }
  },true);
  // ── TÖREN SONU ─────────────────────────────────────────
})();
