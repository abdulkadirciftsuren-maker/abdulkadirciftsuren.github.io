<script>
(function(){
  function pad(n){return n<10?'0'+n:''+n;}
  function tick(){
    var now=new Date();
    var d=document.getElementById('gw-date');
    var t=document.getElementById('gw-time');
    if(d)d.textContent=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
    if(t)t.textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  tick();setInterval(tick,1000);

  // Pırlanta Mührü — tepede tooltip + ışık bağı + 2.5sn delay modal
  var gwTipTimer=null;var gwModalTimer=null;var gwTipShowing=false;
  function showGwTip(btn){
    if(gwTipShowing)return;
    gwTipShowing=true;
    document.getElementById('gw-tip')&&document.getElementById('gw-tip').remove();
    document.getElementById('gw-beam')&&document.getElementById('gw-beam').remove();
    document.querySelectorAll('.gw-spark').forEach(function(s){s.remove();});
    var r=btn.getBoundingClientRect();
    var bx=r.left+r.width/2;var by=r.top;
    var tipTop=80;
    // Işık bağı (ışın)
    var beam=document.createElement('div');beam.id='gw-beam';
    var beamH=by-tipTop-60;
    beam.style.cssText='top:'+(tipTop+60)+'px;height:0;--beam-h:'+beamH+'px;';
    document.body.appendChild(beam);
    // Tooltip tepede
    var tip=document.createElement('div');tip.id='gw-tip';
    var GWT={TR:['💎 AYRICALIKLI DÜNYAYA GİRİŞ YAP 💎','Ayrıcalıklı üyeliğiniz sizi bekliyor...'],EN:['💎 ENTER THE EXCLUSIVE WORLD 💎','Your exclusive membership awaits...'],DE:['💎 EXKLUSIVE WELT BETRETEN 💎','Ihre exklusive Mitgliedschaft wartet...'],ES:['💎 ENTRAR AL MUNDO EXCLUSIVO 💎','Tu membresía exclusiva te espera...'],FR:['💎 ENTRER DANS LE MONDE EXCLUSIF 💎','Votre adhésion exclusive vous attend...'],RU:['💎 ВОЙТИ В МИР ПРИВИЛЕГИЙ 💎','Ваше эксклюзивное членство ждёт...'],UKR:['💎 ЕКСКЛЮЗИВНИЙ ВХІД 💎','Ваше ексклюзивне членство чекає...'],CN:['💎 进入尊享世界 💎','您的尊享会员资格正在等待...'],AR:['💎 ادخل إلى العالم الحصري 💎','عضويتك الحصرية بانتظارك...']};
    var cl=gwGetLang();var gwtx=GWT[cl]||GWT['TR'];
    tip.innerHTML='<div id="gw-tip-txt">'+gwtx[0]+'</div><div id="gw-tip-sub">'+gwtx[1]+'</div>';
    document.body.appendChild(tip);
    // Altın aura
    document.getElementById('gw-aura')&&document.getElementById('gw-aura').remove();
    var aura=document.createElement('div');aura.id='gw-aura';document.body.appendChild(aura);
    setTimeout(function(){aura.remove();},1000);
    // Pırlanta sesi (Web Audio API)
    try{
      var ac=new(window.AudioContext||window.webkitAudioContext)();
      var freqs=[2093,2637,3136,4186];
      freqs.forEach(function(f,i){
        setTimeout(function(){
          var o=ac.createOscillator();var g=ac.createGain();
          o.connect(g);g.connect(ac.destination);
          o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);
          g.gain.setValueAtTime(0.15,ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);
          o.start();o.stop(ac.currentTime+0.4);
        },i*60);
      });
    }catch(e){}
    // Kıvılcımlar tepede
    var sparks=['💎','✦','◆','✧','◇','★'];
    for(var i=0;i<8;i++){
      (function(i){setTimeout(function(){
        var sp=document.createElement('div');sp.className='gw-spark';
        sp.textContent=sparks[i%sparks.length];
        var sx=window.innerWidth/2+(Math.random()-0.5)*200;
        var sy=60+Math.random()*60;
        sp.style.cssText='left:'+sx+'px;top:'+sy+'px;font-size:'+(8+Math.random()*10)+'px;color:#ffd700;text-shadow:0 0 8px #ffd700;';
        document.body.appendChild(sp);
        setTimeout(function(){sp.remove();},1000);
      },i*100);})(i);
    }
    // 2.5 sn sonra modal aç
    // Tooltip'e dokunulunca hemen aç (mobil), masaüstünde 2.5sn
    var delay=('ontouchstart' in window)?1500:4000;
    clearTimeout(gwModalTimer);
    gwModalTimer=setTimeout(function(){
      document.getElementById('gw-tip')&&document.getElementById('gw-tip').remove();
      document.getElementById('gw-beam')&&document.getElementById('gw-beam').remove();
      gwTipShowing=false;
      btn.dataset.gwAllow='1';
      btn.click();
    },delay);
    // Tooltip'e tıklanınca hemen aç
    var tipEl=document.getElementById('gw-tip');
    if(tipEl){tipEl.style.pointerEvents='auto';tipEl.style.cursor='pointer';
      tipEl.addEventListener('click',function(){clearTimeout(gwModalTimer);document.getElementById('gw-tip')&&document.getElementById('gw-tip').remove();document.getElementById('gw-beam')&&document.getElementById('gw-beam').remove();gwTipShowing=false;btn.dataset.gwAllow='1';btn.click();},{once:true});
    }
    // 5sn sonra temizle (daha uzun ekranda kalır)
    clearTimeout(gwTipTimer);
    gwTipTimer=setTimeout(function(){
      document.getElementById('gw-tip')&&document.getElementById('gw-tip').remove();
      document.getElementById('gw-beam')&&document.getElementById('gw-beam').remove();
      gwTipShowing=false;
    },5000);
  }
  function enhanceBin(){
    document.querySelectorAll('.bin').forEach(function(btn){
      if(btn.dataset.gwDone)return;
      btn.dataset.gwDone='1';
      btn.addEventListener('mouseenter',function(){showGwTip(this);});
      btn.addEventListener('mouseleave',function(){/* tooltip tepede kalır */});
      btn.addEventListener('click',function(e){
        if(this.dataset.gwAllow){delete this.dataset.gwAllow;return;}
        e.preventDefault();e.stopImmediatePropagation();
        showGwTip(this);
      },true);
      btn.addEventListener('touchstart',function(){this.classList.add('gw-tap');},{passive:true});
      btn.addEventListener('touchend',function(){var s=this;setTimeout(function(){s.classList.remove('gw-tap');},800);});
    });
  }
  setTimeout(enhanceBin,400);
  setInterval(enhanceBin,2000);

  // VIP Modal — Pırlanta vs Gümüş tier seçici
  // VIP Modal v26 — tier seçici form içine + şölen efekti
  var gwTierActive='diamond';var gwSholenInt=null;
  function stopSholen(){if(gwSholenInt){clearInterval(gwSholenInt);gwSholenInt=null;}document.querySelectorAll('.gw-sholen').forEach(function(s){s.remove();});}
  function startSholen(){
    if(gwSholenInt)return;
    var dEmojis=['💎','✨','⭐','🌟','💫','✦'];
    var sEmojis=['🥈','⚪','🌫️','✧','◇','○'];
    gwSholenInt=setInterval(function(){
      var isDia=gwTierActive==='diamond';
      var emojis=isDia?dEmojis:sEmojis;
      var s=document.createElement('div');s.className='gw-sholen';
      s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      var x=5+Math.random()*90;
      var isDesktop=window.innerWidth>768;
      var sz=isDesktop?(20+Math.random()*20):(14+Math.random()*12);
      var dur=isDesktop?5:4;
      var color=isDia?'#ffd700':'#c0c0c0';
      s.style.cssText='position:fixed;left:'+x+'vw;top:105vh;font-size:'+sz+'px;pointer-events:none;z-index:99990;animation:gw-rise '+dur+'s ease-out forwards;color:'+color+';text-shadow:0 0 8px '+color+';';
      document.body.appendChild(s);
      setTimeout(function(){s.remove();},(dur+0.5)*1000);
    },300);
  }
  function enhanceModal(){
    // Modal kartı bul — form veya input'un atası
    var inputs=document.querySelectorAll('input[type="email"],input[type="password"],input[type="text"]');
    if(!inputs.length||document.getElementById('gw-tier-sel'))return;

  function buildCityStrip(){
    if(document.getElementById('gw-cs'))return;
    var isDesk=window.innerWidth>768;
    var sh=isDesk?'30px':'22px';
    var cSz=isDesk?'8px':'7px';var nSz=isDesk?'11px':'9px';
    var st=document.createElement('div');st.id='gw-cs';
    st.style.cssText='overflow:hidden;height:'+sh+';background:linear-gradient(90deg,#06050a,#09080f,#06050a);border-bottom:1px solid rgba(201,162,39,0.3);display:flex;align-items:center;z-index:1002;position:relative;';
    var inn=document.createElement('div');
    inn.style.cssText='display:flex;white-space:nowrap;align-items:center;will-change:transform;';
    CITIES.forEach(function(c){
      var sp=document.createElement('span');sp.style.cssText='display:inline-flex;align-items:center;gap:5px;padding:0 12px;';
      sp.innerHTML='<span style="font-size:'+cSz+';font-weight:900;color:#c9a227;border:1px solid rgba(201,162,39,0.55);border-radius:4px;padding:1px 5px;letter-spacing:1px;background:rgba(201,162,39,0.08)">'+c[0]+'</span><span style="font-size:'+nSz+';font-weight:700;letter-spacing:1.5px;color:#c9a227;opacity:0.9">'+c[1]+'</span>';
      inn.appendChild(sp);
    });
    st.appendChild(inn);
    var nb=document.querySelector('.navbar');
    if(nb)nb.parentNode.insertBefore(st,nb);
    // Desktop: zaman tabanlı pürüzsüz kaydırma (atlama yok)
    if(isDesk){
      var half=0;
      var dist=0;
      var lastT=null;
      var PPS=50; // pixel/saniye
      function scroll(ts){
        if(!lastT)lastT=ts;
        var dt=(ts-lastT)/1000;
        lastT=ts;
        if(dt>0.1)dt=0.1; // sekme arka plana geçerse spike olmasın
        dist+=PPS*dt;
        if(half>0&&dist>=half)dist=dist-half;
        inn.style.transform='translate3d(-'+dist+'px,0,0)';
        requestAnimationFrame(scroll);
      }
      setTimeout(function(){
        half=inn.scrollWidth/2;
        if(half>0)requestAnimationFrame(scroll);
      },500);
    } else {
      inn.style.animation='s2r 22s linear infinite';
    }
  }
  function updateLayout(){

    GW_CURRLANG=lang;
    bar.dataset.lang=lang;
    var items=bar.querySelectorAll('.gw-hi .gw-lbl');
    var labels=GW_LABELS[lang]||GW_LABELS['TR'];
    items.forEach(function(sp,i){if(labels[i])sp.textContent=labels[i];});
  }
  var GW_CATS=GW_LABELS['TR'];
  function gwBuildHBar(){
    if(window.innerWidth<=768){var b=document.getElementById('gw-hbar');if(b)b.style.display='none';return;}
    if(document.getElementById('gw-hbar')){document.getElementById('gw-hbar').style.display='flex';return;}
    var navbar=document.querySelector('.navbar');
    if(!navbar){setTimeout(gwBuildHBar,200);return;}
    var bar=document.createElement('div');
    bar.id='gw-hbar';
    bar.style.cssText='display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 28px;height:48px;background:rgba(6,5,12,0.97);border-bottom:1px solid rgba(201,162,39,0.18);position:sticky;top:'+(navbar.offsetHeight)+'px;z-index:990;';
    var style=document.createElement('style');
    style.textContent='#gw-hbar::-webkit-scrollbar{display:none}'
     +'@keyframes gw-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.2)}}'
     +'.gw-hi{position:relative;padding:0 18px;height:48px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:DM Sans,sans-serif;font-size:15px;font-weight:600;color:rgba(220,210,195,0.92);letter-spacing:0.4px;white-space:nowrap;transition:color 0.2s;flex-shrink:0}'
     +'.gw-hi::after{content:"";position:absolute;bottom:0;left:15px;right:15px;height:2px;background:linear-gradient(90deg,transparent,#c9a227,#ffd700,#c9a227,transparent);opacity:0;transition:opacity 0.2s}'
     +'.gw-hi:hover{color:#ffd700}.gw-hi:hover::after{opacity:1}'
     +'.gw-hi.gw-act{color:#ffd700;font-weight:700}.gw-hi.gw-act::after{opacity:1}'
     +'.gw-dia{font-size:11px;opacity:0.25;transition:opacity 0.2s}'
     +'.gw-hi.gw-act .gw-dia{opacity:1;animation:gw-pulse 1.5s ease infinite;filter:drop-shadow(0 0 4px #ffd700)}'
     +'.gw-hi:hover .gw-dia{opacity:0.7}';
    document.head.appendChild(style);
    bar.dataset.lang='TR';
    GW_CATS.forEach(function(lbl,i){
      var d=document.createElement('div');
      d.className='gw-hi';
      d.dataset.idx=i;
      d.innerHTML='<span class="gw-dia">💎</span><span class="gw-lbl">'+lbl+'</span>';
      d.onclick=function(){
        var idx=parseInt(this.dataset.idx);
        var sbi=document.querySelectorAll('.sbi');
        if(sbi[idx])sbi[idx].click();
        bar.querySelectorAll('.gw-hi').forEach(function(el){el.classList.remove('gw-act');});
        this.classList.add('gw-act');
      };
      bar.appendChild(d);
    });
    navbar.insertAdjacentElement('afterend',bar);
  }
  new MutationObserver(function(){if(!document.getElementById('gw-hbar')&&window.innerWidth>768)gwBuildHBar();}).observe(document.body,{childList:true,subtree:false});
  // Dil değişimini güvenli izle
  setInterval(gwRefreshLabels,800);
  setTimeout(gwBuildHBar,500);
  window.addEventListener('resize',function(){gwBuildHBar();});
  // ── YATAY MENÜ SONU v4 ─────────────────────────────────

  // Dil menüsü dışarı tık + Android geri kapama
  var overlay=document.createElement('div');
  overlay.style.cssText='display:none;position:fixed;inset:0;z-index:999;background:transparent;';
  document.body.appendChild(overlay);

  function closeLangMenu(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd){dd.click();}
    overlay.style.display='none';
    window._langOpen=false;
  }

  overlay.addEventListener('click',function(){closeLangMenu();});

  window.addEventListener('popstate',function(){
    if(window._langOpen){closeLangMenu();}
  });

  new MutationObserver(function(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd&&!window._langOpen){
      window._langOpen=true;
      overlay.style.display='block';
      history.pushState(null,'',location.href);
    } else if(!dd&&window._langOpen){
      window._langOpen=false;
      overlay.style.display='none';
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
