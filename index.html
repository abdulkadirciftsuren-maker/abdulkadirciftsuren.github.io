<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="icon" href="/abdulkadirciftsuren.github.io/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="Web site created using create-react-app"/><link rel="apple-touch-icon" href="/abdulkadirciftsuren.github.io/logo192.png"/><link rel="manifest" href="/abdulkadirciftsuren.github.io/manifest.json"/><title>React App</title><script defer="defer" src="/abdulkadirciftsuren.github.io/static/js/main.d1ce564f.js"></script><link href="/abdulkadirciftsuren.github.io/static/css/main.e6c13ad2.css" rel="stylesheet"></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div>
<div id="gw-badge" style="position:fixed;left:10px;top:10px;z-index:99999;display:flex;flex-direction:column;gap:2px;pointer-events:auto;cursor:grab;user-select:none;touch-action:none;">
  <div style="display:flex;align-items:center;gap:4px">
    <span style="font-size:9px;font-weight:900;color:#ffd700;background:rgba(0,0,0,0.88);border:1px solid rgba(201,162,39,0.6);border-radius:5px;padding:2px 7px;letter-spacing:1px">v3</span>
    <span id="gw-date" style="font-size:8px;font-weight:700;color:rgba(201,162,39,0.8);background:rgba(0,0,0,0.8);border:1px solid rgba(201,162,39,0.3);border-radius:5px;padding:2px 6px"></span>
  </div>
  <span id="gw-time" style="font-size:9px;font-weight:700;color:rgba(201,162,39,0.7);background:rgba(0,0,0,0.75);border:1px solid rgba(201,162,39,0.2);border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums"></span>
</div>
<style>
.mob-overlay{background:transparent!important;pointer-events:none!important;}
.sidebar,.sbi,.sbs{pointer-events:auto!important;}
.sbi{cursor:pointer!important;}
@media screen and (min-width:769px){
  html body .sidebar{display:none!important;}
  #gw-hbar{display:flex!important;}
  html body .main{margin-left:0!important;}
  html body .menu-fab{display:none!important;}
}
@media screen and (max-width:768px){
  .strip2{z-index:1001!important;position:relative!important;}
  html body .layout .sidebar{
    position:fixed!important;top:0!important;bottom:0!important;right:0!important;left:auto!important;
    width:180px!important;z-index:999!important;padding-top:120px!important;
    border:none!important;border-radius:0!important;
    background:transparent!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
    transition:transform 0.3s ease!important;overflow-y:auto!important;
    box-shadow:none!important;
  }
  html body .layout .sidebar.closed{transform:translateX(110%)!important;box-shadow:none!important;}
  html body .layout .sidebar:not(.closed){transform:translateX(0)!important;box-shadow:none!important;}
  html body .layout .sbs{
    font-size:7px!important;letter-spacing:3px!important;
    color:rgba(201,162,39,0.5)!important;
    padding:14px 10px 4px!important;font-weight:900!important;
    text-transform:uppercase!important;
    background:none!important;border:none!important;
  }
  html body .layout .sbi{
    padding:9px 10px!important;font-size:13px!important;font-weight:700!important;
    border-radius:8px!important;margin:2px 4px!important;
    color:rgba(255,255,255,0.9)!important;
    background:none!important;border:none!important;
    text-shadow:0 1px 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.6)!important;
    letter-spacing:0.3px!important;
  }
  html body .layout .sbi.act{
    color:#ffd700!important;
    text-shadow:0 0 12px rgba(255,215,0,0.6),0 1px 8px rgba(0,0,0,0.8)!important;
    background:none!important;
    border-left:none!important;
    border-right:3px solid #c9a227!important;
    border-top:none!important;border-bottom:none!important;
  }
}
@media screen and (max-width:480px){
  html body .layout .sidebar{width:170px!important;padding-top:100px!important;}
}
</style>
<script>
(function(){
  function pad(n){return n<10?'0'+n:''+n;}
  function tick(){
    var now=new Date();
    var d=document.getElementById('gw-date');
    var t=document.getElementById('gw-time');
    if(d)d.textContent=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
    if(t)t.textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  tick();setInterval(tick,1000);

  // Rozet sürükleme
  var badge=document.getElementById('gw-badge');
  var dragging=false,ox=0,oy=0;
  badge.addEventListener('mousedown',function(e){dragging=true;ox=e.clientX-badge.offsetLeft;oy=e.clientY-badge.offsetTop;badge.style.cursor='grabbing';e.preventDefault();});
  badge.addEventListener('touchstart',function(e){dragging=true;ox=e.touches[0].clientX-badge.offsetLeft;oy=e.touches[0].clientY-badge.offsetTop;e.preventDefault();},{passive:false});
  document.addEventListener('mousemove',function(e){if(!dragging)return;badge.style.left=Math.max(0,Math.min(window.innerWidth-badge.offsetWidth,e.clientX-ox))+'px';badge.style.top=Math.max(0,Math.min(window.innerHeight-badge.offsetHeight,e.clientY-oy))+'px';});
  document.addEventListener('touchmove',function(e){if(!dragging)return;badge.style.left=Math.max(0,Math.min(window.innerWidth-badge.offsetWidth,e.touches[0].clientX-ox))+'px';badge.style.top=Math.max(0,Math.min(window.innerHeight-badge.offsetHeight,e.touches[0].clientY-oy))+'px';},{passive:false});
  document.addEventListener('mouseup',function(){dragging=false;badge.style.cursor='grab';});
  document.addEventListener('touchend',function(){dragging=false;});

  // ── YATAY MASAÜSTÜ MENÜ v2 ─────────────────────────────
  // NOT: Dil değişince menü güncellenir — GW_LABELS bu yüzden burada
  var GW_LABELS={
    TR:['Ana Sayfa','Keşfet','Berberler','Kuaförler','Masaj','Makyaj','Tırnak','Eğitimler','İş İlanları','Harita','Canlı Yayın','Mesajlar','Profilim','Ayarlar'],
    EN:['Home','Explore','Barbers','Hairdressers','Massage','Makeup','Nails','Trainings','Jobs','Map','Live','Messages','Profile','Settings'],
    DE:['Startseite','Entdecken','Friseure','Stylistinnen','Massage','Makeup','Nägel','Schulungen','Stellen','Karte','Livestream','Nachrichten','Profil','Einstellungen'],
    ES:['Inicio','Explorar','Barberos','Peluqueros','Masaje','Maquillaje','Uñas','Cursos','Trabajo','Mapa','Directo','Mensajes','Perfil','Ajustes'],
    RU:['Главная','Обзор','Барберы','Парикмахеры','Массаж','Макияж','Ногти','Курсы','Работа','Карта','Эфир','Сообщения','Профиль','Настройки'],
    FR:['Accueil','Explorer','Barbiers','Coiffeurs','Massage','Maquillage','Ongles','Formations','Emplois','Carte','Live','Messages','Profil','Paramètres'],
    UKR:['Головна','Огляд','Перукарі','Стилісти','Масаж','Макіяж','Нігті','Навчання','Вакансії','Карта','Ефір','Повідомлення','Профіль','Налаштування']
  };
  var GW_SBIKEYS=['homePage','explore','barbers','hairdressers','massage','makeup','nails','trainings','jobsMenu','mapMenu','liveStream','messages','myProfile','settings'];

  function gwDetectLang(){
    var btn=document.querySelector('.navbar button span[style*="letter"]');
    if(btn){var t=btn.textContent.trim();if(GW_LABELS[t])return t;}
    return 'TR';
  }

  function gwUpdateHBar(){
    var bar=document.getElementById('gw-hbar');
    if(!bar||window.innerWidth<=768)return;
    var lang=gwDetectLang();
    var labels=GW_LABELS[lang]||GW_LABELS['TR'];
    var items=bar.querySelectorAll('.gw-hi span.gw-lbl');
    items.forEach(function(sp,i){if(labels[i])sp.textContent=labels[i];});
  }

  function gwBuildHBar(){
    if(window.innerWidth<=768){var b=document.getElementById('gw-hbar');if(b)b.style.display='none';return;}
    if(document.getElementById('gw-hbar')){document.getElementById('gw-hbar').style.display='flex';gwUpdateHBar();return;}
    var navbar=document.querySelector('.navbar');
    if(!navbar){setTimeout(gwBuildHBar,300);return;}
    var bar=document.createElement('div');
    bar.id='gw-hbar';
    bar.style.cssText='display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 24px;height:44px;background:rgba(6,5,12,0.97);border-bottom:1px solid rgba(201,162,39,0.18);position:sticky;top:'+(navbar.offsetHeight)+'px;z-index:990;';
    var st=document.createElement('style');
    st.textContent='#gw-hbar::-webkit-scrollbar{display:none}'
     +'.gw-hi{position:relative;padding:0 15px;height:44px;display:flex;align-items:center;gap:5px;cursor:pointer;font-family:DM Sans,sans-serif;font-size:14px;font-weight:600;color:rgba(220,210,195,0.92);letter-spacing:0.3px;white-space:nowrap;transition:color 0.2s;border-bottom:2px solid transparent;flex-shrink:0}'
     +'.gw-hi:hover{color:#ffd700}'
     +'.gw-hi::after{content:"";position:absolute;bottom:0;left:15px;right:15px;height:2px;background:linear-gradient(90deg,transparent,#c9a227,#ffd700,#c9a227,transparent);opacity:0;transition:opacity 0.2s;}'
     +'.gw-hi:hover::after{opacity:1}'
     +'.gw-hi.gw-act{color:#ffd700;font-weight:700}'
     +'.gw-hi.gw-act::after{opacity:1}'
     +'.gw-dia{font-size:10px;opacity:0;transition:opacity 0.2s,transform 0.2s}'
     +'@keyframes gw-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}'
     +'.gw-hi:hover .gw-dia{opacity:1;animation:gw-shake 0.4s ease infinite}';
    document.head.appendChild(st);
    var lang=gwDetectLang();
    var labels=GW_LABELS[lang]||GW_LABELS['TR'];
    labels.forEach(function(lbl,i){
      var d=document.createElement('div');
      d.className='gw-hi';
      d.dataset.idx=i;
      d.innerHTML='<span class="gw-lbl">'+lbl+'</span><span class="gw-dia">💎</span>';
      d.onclick=function(){
        var idx=parseInt(this.dataset.idx);
        var sbi=document.querySelectorAll('.sbi');
        if(sbi[idx])sbi[idx].click();
        bar.querySelectorAll('.gw-hi').forEach(function(el){el.classList.remove('gw-act');});
        this.classList.add('gw-act');
      };
      bar.appendChild(d);
    });
    navbar.insertAdjacentElement('afterend',bar);
  }

  // Dil değişince menü güncelle (hafif observer)
  var gwBuilding=false;
  new MutationObserver(function(){
    if(gwBuilding)return;
    gwBuilding=true;
    setTimeout(function(){
      if(!document.getElementById('gw-hbar')&&window.innerWidth>768)gwBuildHBar();
      else gwUpdateHBar();
      gwBuilding=false;
    },100);
  }).observe(document.body,{childList:true,subtree:false});
  setTimeout(gwBuildHBar,500);
  window.addEventListener('resize',gwBuildHBar);
  // ── YATAY MENÜ SONU v2 ─────────────────────────────────

  // Dil menüsü dışarı tık + Android geri kapama
  var overlay=document.createElement('div');
  overlay.style.cssText='display:none;position:fixed;inset:0;z-index:999;background:transparent;';
  document.body.appendChild(overlay);

  function closeLangMenu(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd){dd.click();}
    overlay.style.display='none';
    window._langOpen=false;
  }

  overlay.addEventListener('click',function(){closeLangMenu();});

  window.addEventListener('popstate',function(){
    if(window._langOpen){closeLangMenu();}
  });

  new MutationObserver(function(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd&&!window._langOpen){
      window._langOpen=true;
      overlay.style.display='block';
      history.pushState(null,'',location.href);
    } else if(!dd&&window._langOpen){
      window._langOpen=false;
      overlay.style.display='none';
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
