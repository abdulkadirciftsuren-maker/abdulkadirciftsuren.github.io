<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="icon" href="/abdulkadirciftsuren.github.io/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="Web site created using create-react-app"/><link rel="apple-touch-icon" href="/abdulkadirciftsuren.github.io/logo192.png"/><link rel="manifest" href="/abdulkadirciftsuren.github.io/manifest.json"/><title>React App</title><script defer="defer" src="/abdulkadirciftsuren.github.io/static/js/main.d1ce564f.js"></script><link href="/abdulkadirciftsuren.github.io/static/css/main.e6c13ad2.css" rel="stylesheet"></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div>
<div id="gw-badge" style="position:fixed;left:10px;top:10px;z-index:99999;display:flex;flex-direction:column;gap:2px;pointer-events:none">
  <div style="display:flex;align-items:center;gap:4px">
    <span style="font-size:9px;font-weight:900;color:#ffd700;background:rgba(0,0,0,0.88);border:1px solid rgba(201,162,39,0.6);border-radius:5px;padding:2px 7px;letter-spacing:1px">v43</span>
    <span id="gw-date" style="font-size:8px;font-weight:700;color:rgba(201,162,39,0.8);background:rgba(0,0,0,0.8);border:1px solid rgba(201,162,39,0.3);border-radius:5px;padding:2px 6px"></span>
  </div>
  <span id="gw-time" style="font-size:9px;font-weight:700;color:rgba(201,162,39,0.7);background:rgba(0,0,0,0.75);border:1px solid rgba(201,162,39,0.2);border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums"></span>
</div>
<style>
.mob-overlay{background:transparent!important;pointer-events:none!important;}
.sidebar,.sbi,.sbs{pointer-events:auto!important;}
.sbi{cursor:pointer!important;}
@media screen and (min-width:769px){
  html body .sidebar{display:none!important;}
}
@media screen and (max-width:768px){
  .strip2{z-index:1001!important;position:relative!important;}
  html body .layout .sidebar{
    position:fixed!important;top:0!important;bottom:0!important;right:0!important;left:auto!important;
    width:180px!important;z-index:999!important;padding-top:120px!important;
    border:none!important;border-radius:0!important;
    background:transparent!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
    transition:transform 0.3s ease!important;overflow-y:auto!important;
    box-shadow:none!important;
  }
  html body .layout .sidebar.closed{transform:translateX(110%)!important;box-shadow:none!important;}
  html body .layout .sidebar:not(.closed){transform:translateX(0)!important;box-shadow:none!important;}
  html body .layout .sbs{
    font-size:7px!important;letter-spacing:3px!important;
    color:rgba(201,162,39,0.5)!important;
    padding:14px 10px 4px!important;font-weight:900!important;
    text-transform:uppercase!important;
    background:none!important;border:none!important;
  }
  html body .layout .sbi{
    padding:9px 10px!important;font-size:13px!important;font-weight:700!important;
    border-radius:8px!important;margin:2px 4px!important;
    color:rgba(255,255,255,0.9)!important;
    background:none!important;border:none!important;
    text-shadow:0 1px 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.6)!important;
    letter-spacing:0.3px!important;
  }
  html body .layout .sbi.act{
    color:#ffd700!important;
    text-shadow:0 0 12px rgba(255,215,0,0.6),0 1px 8px rgba(0,0,0,0.8)!important;
    background:none!important;
    border-left:none!important;
    border-right:3px solid #c9a227!important;
    border-top:none!important;border-bottom:none!important;
  }
}
@media screen and (max-width:480px){
  html body .layout .sidebar{width:170px!important;padding-top:100px!important;}
}
</style>
<script>
(function(){
  function pad(n){return n<10?'0'+n:''+n;}
  function tick(){
    var now=new Date();
    var d=document.getElementById('gw-date');
    var t=document.getElementById('gw-time');
    if(d)d.textContent=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
    if(t)t.textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  tick();setInterval(tick,1000);

  // ── MASAÜSTÜ MENÜ ─────────────────────────────────────
  var GW_ITEMS=[
    {ic:'🏠',c:'#38b2ac',lbl:'Ana Sayfa'},
    {ic:'🔍',c:'#9333ea',lbl:'Keşfet'},
    {ic:'✂️',c:'#ed64a6',lbl:'Berberler'},
    {ic:'💇',c:'#f59e0b',lbl:'Kuaförler'},
    {ic:'💆',c:'#38b2ac',lbl:'Masaj'},
    {ic:'💄',c:'#f472b6',lbl:'Makyaj'},
    {ic:'💅',c:'#a78bfa',lbl:'Tırnak'},
    {ic:'📚',c:'#34d399',lbl:'Eğitimler'},
    {ic:'💼',c:'#60a5fa',lbl:'İş İlanları'},
    {ic:'🗺️',c:'#fbbf24',lbl:'Harita'},
    {ic:'📡',c:'#f87171',lbl:'Canlı Yayın'},
    {ic:'✉️',c:'#4ade80',lbl:'Mesajlar'},
    {ic:'👤',c:'#38b2ac',lbl:'Profilim'},
    {ic:'⚙️',c:'#9ca3af',lbl:'Ayarlar'}
  ];
  function gwBuildNav(){
    if(window.innerWidth<=768){var n=document.getElementById('gw-nav');if(n)n.style.display='none';return;}
    var existing=document.getElementById('gw-nav');
    if(existing){existing.style.display='block';return;}
    // Hamburger gizle
    var fab=document.querySelector('.menu-fab');
    if(fab)fab.style.display='none';
    var nav=document.createElement('div');
    nav.id='gw-nav';
    nav.style.cssText='position:fixed;left:0;top:160px;bottom:0;width:200px;z-index:900;overflow-y:auto;padding:4px 0 24px;border-right:1px solid rgba(201,162,39,0.12);';
    GW_ITEMS.forEach(function(m){
      var d=document.createElement('div');
      d.className='gw-ni';
      d.dataset.lbl=m.lbl;
      d.style.cssText='display:flex;align-items:center;gap:11px;padding:10px 16px;cursor:pointer;font-family:DM Sans,sans-serif;font-size:14px;font-weight:600;color:rgba(230,220,205,0.9);transition:all 0.18s;border-left:3px solid transparent;';
      d.innerHTML='<span style="font-size:18px;width:22px;text-align:center;flex-shrink:0">'+m.ic+'</span><span>'+m.lbl+'</span>';
      d.onmouseover=function(){if(!this._act){this.style.color='#ffd700';this.style.background='rgba(201,162,39,0.05)';}};
      d.onmouseout=function(){if(!this._act){this.style.color='rgba(230,220,205,0.9)';this.style.background='transparent';}};
      d.onclick=function(){
        var lbl=this.dataset.lbl;
        // Gizli sidebar'dan eşleşen öğeyi bul ve tıkla
        var matched=null;
        document.querySelectorAll('.sbi').forEach(function(s){if(s.textContent.trim().indexOf(lbl)>=0)matched=s;});
        if(matched)matched.click();
        // Aktif durumu güncelle
        nav.querySelectorAll('.gw-ni').forEach(function(el){el._act=false;el.style.color='rgba(230,220,205,0.9)';el.style.background='transparent';el.style.borderLeft='3px solid transparent';});
        this._act=true;this.style.color='#ffd700';this.style.background='rgba(201,162,39,0.07)';this.style.borderLeft='3px solid #c9a227';
      };
      nav.appendChild(d);
    });
    document.body.appendChild(nav);
  }
  new MutationObserver(function(){if(!document.getElementById('gw-nav')&&window.innerWidth>768)gwBuildNav();}).observe(document.body,{childList:true,subtree:false});
  setTimeout(gwBuildNav,500);
  window.addEventListener('resize',gwBuildNav);
  // ── MASAÜSTÜ MENÜ SONU ────────────────────────────────

  // Dil menüsü dışarı tık + Android geri kapama
  var overlay=document.createElement('div');
  overlay.style.cssText='display:none;position:fixed;inset:0;z-index:999;background:transparent;';
  document.body.appendChild(overlay);

  function closeLangMenu(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd){dd.click();}
    overlay.style.display='none';
    window._langOpen=false;
  }

  overlay.addEventListener('click',function(){closeLangMenu();});

  window.addEventListener('popstate',function(){
    if(window._langOpen){closeLangMenu();}
  });

  new MutationObserver(function(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd&&!window._langOpen){
      window._langOpen=true;
      overlay.style.display='block';
      history.pushState(null,'',location.href);
    } else if(!dd&&window._langOpen){
      window._langOpen=false;
      overlay.style.display='none';
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
