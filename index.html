</div>

  html body .layout .sidebar{

/* Portrait: genel mobil kuralından SONRA - lsub göster */
@media screen and (max-width:768px) and (orientation:portrait){

<script>
(function(){
  function pad(n){return n<10?'0'+n:''+n;}
  function tick(){
    var now=new Date();
    var d=document.getElementById('gw-date');
    var t=document.getElementById('gw-time');
    if(d)d.textContent=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
    if(t)t.textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  }
  tick();setInterval(tick,1000);

  // v17: Şehir şeridi - desktop + yatay telefon, portrait'te gizle
  var CITIES=[['TR','İSTANBUL'],['US','NEW YORK'],['FR','PARİS'],['GB','LONDRA'],['DE','BERLİN'],['AE','DUBAI'],['JP','TOKYO'],['CN','ŞANGAY'],['RU','MOSKOVA'],['ES','MADRİD'],['IT','ROMA'],['NL','AMSTERDAM'],['CH','ZÜRIH'],['AT','VİYANA'],['SE','STOCKHOLM'],['SG','SİNGAPUR'],['IN','MUMBAY'],['AU','SİDNEY'],['BR','RİO'],['CA','TORONTO'],['SA','RİYAD'],['KR','SEUL'],['GR','ATİNA'],['PT','LİZBON'],['TR','İSTANBUL'],['US','NEW YORK'],['FR','PARİS'],['GB','LONDRA'],['DE','BERLİN'],['AE','DUBAI']];
  function buildCityStrip(){
    if(document.getElementById('gw-cs'))return;
    var isDesk=window.innerWidth>768;
    var sh=isDesk?'30px':'22px';
    var cSz=isDesk?'8px':'7px';var nSz=isDesk?'11px':'9px';
    var st=document.createElement('div');st.id='gw-cs';
    st.style.cssText='overflow:hidden;height:'+sh+';background:linear-gradient(90deg,#06050a,#09080f,#06050a);border-bottom:1px solid rgba(201,162,39,0.3);display:flex;align-items:center;z-index:1002;position:relative;';
    var inn=document.createElement('div');
    inn.style.cssText='display:flex;white-space:nowrap;align-items:center;will-change:transform;';
    CITIES.forEach(function(c){
      var sp=document.createElement('span');sp.style.cssText='display:inline-flex;align-items:center;gap:5px;padding:0 12px;';
      sp.innerHTML='<span style="font-size:'+cSz+';font-weight:900;color:#c9a227;border:1px solid rgba(201,162,39,0.55);border-radius:4px;padding:1px 5px;letter-spacing:1px;background:rgba(201,162,39,0.08)">'+c[0]+'</span><span style="font-size:'+nSz+';font-weight:700;letter-spacing:1.5px;color:#c9a227;opacity:0.9">'+c[1]+'</span>';
      inn.appendChild(sp);
    });
    st.appendChild(inn);
    var nb=document.querySelector('.navbar');
    if(nb)nb.parentNode.insertBefore(st,nb);
    // Desktop: zaman tabanlı pürüzsüz kaydırma (atlama yok)
    if(isDesk){
      var half=0;
      var dist=0;
      var lastT=null;
      var PPS=50; // pixel/saniye
      function scroll(ts){
        if(!lastT)lastT=ts;
        var dt=(ts-lastT)/1000;
        lastT=ts;
        if(dt>0.1)dt=0.1; // sekme arka plana geçerse spike olmasın
        dist+=PPS*dt;
        if(half>0&&dist>=half)dist=dist-half;
        inn.style.transform='translate3d(-'+dist+'px,0,0)';
        requestAnimationFrame(scroll);
      }
      setTimeout(function(){
        half=inn.scrollWidth/2;
        if(half>0)requestAnimationFrame(scroll);
      },500);
    } else {
      inn.style.animation='s2r 22s linear infinite';
    }
  }
  function updateLayout(){
    var w=window.innerWidth,h=window.innerHeight;
    var isDesktop=w>768;
    var isLandscape=w>h&&h<=500;
    var isPortrait=!isDesktop&&!isLandscape;
    var s2=document.querySelector('.strip2');
    var cs=document.getElementById('gw-cs');
    if(isPortrait){
      buildCityStrip();
      if(cs)cs.style.display='flex';
      if(s2)s2.style.setProperty('display','none','important');
      var lb=document.querySelector('.lbar');
      if(lb){
        // Landscape'den kalan inline stilleri tamamen sil
        ['height','min-height','padding','flex-direction','align-items','justify-content','display'].forEach(function(p){lb.style.removeProperty(p);});
        // Portrait için explicit değer ata (56px CSS kuralını güçlendir)
        lb.style.setProperty('height','56px','important');
        lb.style.setProperty('padding','0 14px','important');
        lb.style.setProperty('flex-direction','row','important');
        lb.style.setProperty('align-items','center','important');
        lb.style.setProperty('justify-content','space-between','important');
      }
      return;
    }
    // Desktop veya Landscape: şehir şeridini göster
    buildCityStrip();
    if(cs)cs.style.display='flex';
    if(s2)s2.style.setProperty('display','none','important');
    if(isLandscape){
      var lb=document.querySelector('.lbar');
      if(lb){lb.style.setProperty('height','auto','important');lb.style.setProperty('min-height','80px','important');lb.style.setProperty('padding','16px 20px 14px','important');lb.style.setProperty('flex-direction','column','important');lb.style.setProperty('align-items','flex-start','important');lb.style.setProperty('justify-content','flex-start','important');}
      var ls2=lb&&lb.querySelector('.lsub');
      if(ls2){ls2.style.setProperty('display','block','important');ls2.style.setProperty('margin-top','8px','important');ls2.style.setProperty('font-size','8px','important');}
    }
  }
  setInterval(updateLayout,400);
  window.addEventListener('orientationchange',function(){setTimeout(updateLayout,200);});
  window.addEventListener('resize',updateLayout);

  // v8: Header iki katına, arama en alta - body'e runtime style ekle
  function fixDesktopLayout(){
    if(window.innerWidth<=768)return;
    // Runtime style - body sonuna ekle (compiled CSS'ten sonra)
    var sid='gw-rt-style';
    var el=document.getElementById(sid);
    if(!el){el=document.createElement('style');el.id=sid;document.body.appendChild(el);}
    el.textContent=''
      /* Bilgisayar - biraz küçültüldü */
      +'@media screen and (min-width:769px){'
      +'html body .navbar .lbar{height:auto!important;min-height:110px!important;padding:24px 40px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;}'
      +'html body .ltx{font-size:28px!important;letter-spacing:5px!important;font-weight:900!important;}'
      +'html body .lsub{display:block!important;font-size:10px!important;letter-spacing:3px!important;opacity:0.7!important;margin-top:6px!important;}'
      +'html body .navbar .nbar{padding:12px 40px!important;height:auto!important;min-height:48px!important;display:flex!important;align-items:center!important;}'
      +'html body .navbar .nbar input{height:26px!important;font-size:12px!important;border-radius:20px!important;padding:0 14px!important;border-width:1px!important;}'
      +'}'
      /* ── TELEFON YATAY: SARAY GİRİŞİ ── */
      +'@media screen and (orientation:landscape) and (max-height:500px){'
      /* Navbar flex-column: lbar üstte, nbar altta */
      +'html body .navbar{display:flex!important;flex-direction:column!important;}'
      /* Lbar: GLAMWORLD tepede, slogan 45px aşağıda */
      +'html body .navbar .lbar{height:auto!important;min-height:unset!important;padding:24px 24px 24px!important;display:flex!important;align-items:flex-start!important;flex-direction:column!important;justify-content:flex-start!important;}'
      +'html body .ltx{font-size:20px!important;letter-spacing:4px!important;font-weight:900!important;}'
      +'html body .lsub{display:block!important;font-size:9px!important;letter-spacing:2.5px!important;opacity:0.7!important;margin-top:16px!important;line-height:1.4!important;}'
      /* Nbar: en altta, slogandan uzak */
      +'html body .navbar .nbar{height:auto!important;padding:8px 24px 12px!important;display:flex!important;align-items:center!important;border-top:1px solid rgba(201,162,39,0.15)!important;}'
      +'html body .navbar .nbar input{height:24px!important;font-size:12px!important;border-radius:20px!important;padding:0 14px!important;}'
      +'}';

    var lb=document.querySelector('.lbar');
    if(lb){
      lb.style.setProperty('height','auto','important');
      lb.style.setProperty('padding','28px 40px','important');
      lb.style.setProperty('display','flex','important');
      lb.style.setProperty('align-items','center','important');
      lb.style.setProperty('justify-content','space-between','important');
    }
    // Nbar: aşağıda, ince
    var nb=document.querySelector('.nbar');
    if(nb){
      nb.style.setProperty('margin-top','0','important');
      nb.style.setProperty('height','38px','important');
      nb.style.setProperty('min-height','unset','important');
      nb.style.setProperty('padding','0 40px','important');
      nb.style.setProperty('display','flex','important');
      nb.style.setProperty('align-items','center','important');
    }
    // Input: ince çizgi
    document.querySelectorAll('.nbar input').forEach(function(inp){
      inp.style.setProperty('height','22px','important');
      inp.style.setProperty('font-size','12px','important');
      inp.style.setProperty('padding','0 14px','important');
      inp.style.setProperty('border-radius','20px','important');
      inp.style.setProperty('border-width','1px','important');
    });
  }
  setTimeout(fixDesktopLayout,300);
  setInterval(fixDesktopLayout,1500);
  window.addEventListener('resize',fixDesktopLayout);


  // Rozet sürükleme
  var badge=document.getElementById('gw-badge');
  var dragging=false,ox=0,oy=0;
  badge.addEventListener('mousedown',function(e){dragging=true;ox=e.clientX-badge.offsetLeft;oy=e.clientY-badge.offsetTop;badge.style.cursor='grabbing';e.preventDefault();});
  badge.addEventListener('touchstart',function(e){dragging=true;ox=e.touches[0].clientX-badge.offsetLeft;oy=e.touches[0].clientY-badge.offsetTop;e.preventDefault();},{passive:false});
  document.addEventListener('mousemove',function(e){if(!dragging)return;badge.style.left=Math.max(0,Math.min(window.innerWidth-badge.offsetWidth,e.clientX-ox))+'px';badge.style.top=Math.max(0,Math.min(window.innerHeight-badge.offsetHeight,e.clientY-oy))+'px';});
  document.addEventListener('touchmove',function(e){if(!dragging)return;badge.style.left=Math.max(0,Math.min(window.innerWidth-badge.offsetWidth,e.touches[0].clientX-ox))+'px';badge.style.top=Math.max(0,Math.min(window.innerHeight-badge.offsetHeight,e.touches[0].clientY-oy))+'px';},{passive:false});
  document.addEventListener('mouseup',function(){dragging=false;badge.style.cursor='grab';});
  document.addEventListener('touchend',function(){dragging=false;});

  // ── YATAY MASAÜSTÜ MENÜ v4 ─────────────────────────────
  // DİL SÖZLÜĞÜ - JS bozulmasın diye compiled JS'e dokunulmadı
  var GW_LABELS={
    TR:['Ana Sayfa','Keşfet','Berberler','Kuaförler','Masaj','Makyaj','Tırnak','Eğitimler','İş İlanları','Harita','Canlı Yayın','Mesajlar','Profilim','Ayarlar'],
    EN:['Home','Explore','Barbers','Hairdressers','Massage','Makeup','Nails','Trainings','Jobs','Map','Live','Messages','Profile','Settings'],
    DE:['Startseite','Entdecken','Friseure','Stylistinnen','Massage','Makeup','Nägel','Schulungen','Stellen','Karte','Livestream','Nachrichten','Profil','Einstellungen'],
    ES:['Inicio','Explorar','Barberos','Peluqueros','Masaje','Maquillaje','Uñas','Cursos','Trabajo','Mapa','Directo','Mensajes','Perfil','Ajustes'],
    FR:['Accueil','Explorer','Barbiers','Coiffeurs','Massage','Maquillage','Ongles','Formations','Emplois','Carte','Live','Messages','Profil','Paramètres'],
    RU:['Главная','Обзор','Барберы','Парикмахеры','Массаж','Макияж','Ногти','Курсы','Работа','Карта','Эфир','Сообщения','Профиль','Настройки'],
    UKR:['Головна','Огляд','Перукарі','Стилісти','Масаж','Макіяж','Нігті','Навчання','Вакансії','Карта','Ефір','Повідомлення','Профіль','Налаштування']
  };
  var GW_CURRLANG='TR';
  function gwGetLang(){
    // Navbar'daki dil butonundan kodu oku
    var spans=document.querySelectorAll('.navbar span');
    for(var i=0;i<spans.length;i++){
      var t=spans[i].textContent.trim();
      if(GW_LABELS[t])return t;
    }
    return GW_CURRLANG;
  }
  function gwRefreshLabels(){
    var bar=document.getElementById('gw-hbar');
    if(!bar)return;
    var lang=gwGetLang();
    if(lang===GW_CURRLANG&&bar.dataset.lang===lang)return;
    GW_CURRLANG=lang;
    bar.dataset.lang=lang;
    var items=bar.querySelectorAll('.gw-hi .gw-lbl');
    var labels=GW_LABELS[lang]||GW_LABELS['TR'];
    items.forEach(function(sp,i){if(labels[i])sp.textContent=labels[i];});
  }
  var GW_CATS=GW_LABELS['TR'];
  function gwBuildHBar(){
    if(window.innerWidth<=768){var b=document.getElementById('gw-hbar');if(b)b.style.display='none';return;}
    if(document.getElementById('gw-hbar')){document.getElementById('gw-hbar').style.display='flex';return;}
    var navbar=document.querySelector('.navbar');
    if(!navbar){setTimeout(gwBuildHBar,200);return;}
    var bar=document.createElement('div');
    bar.id='gw-hbar';
    bar.style.cssText='display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;gap:0;padding:0 28px;height:48px;background:rgba(6,5,12,0.97);border-bottom:1px solid rgba(201,162,39,0.18);position:sticky;top:'+(navbar.offsetHeight)+'px;z-index:990;';
    var style=document.createElement('style');
    style.textContent='#gw-hbar::-webkit-scrollbar{display:none}'
     +'@keyframes gw-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.2)}}'
     +'.gw-hi{position:relative;padding:0 18px;height:48px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:DM Sans,sans-serif;font-size:15px;font-weight:600;color:rgba(220,210,195,0.92);letter-spacing:0.4px;white-space:nowrap;transition:color 0.2s;flex-shrink:0}'
     +'.gw-hi::after{content:"";position:absolute;bottom:0;left:15px;right:15px;height:2px;background:linear-gradient(90deg,transparent,#c9a227,#ffd700,#c9a227,transparent);opacity:0;transition:opacity 0.2s}'
     +'.gw-hi:hover{color:#ffd700}.gw-hi:hover::after{opacity:1}'
     +'.gw-hi.gw-act{color:#ffd700;font-weight:700}.gw-hi.gw-act::after{opacity:1}'
     +'.gw-dia{font-size:11px;opacity:0.25;transition:opacity 0.2s}'
     +'.gw-hi.gw-act .gw-dia{opacity:1;animation:gw-pulse 1.5s ease infinite;filter:drop-shadow(0 0 4px #ffd700)}'
     +'.gw-hi:hover .gw-dia{opacity:0.7}';
    document.head.appendChild(style);
    bar.dataset.lang='TR';
    GW_CATS.forEach(function(lbl,i){
      var d=document.createElement('div');
      d.className='gw-hi';
      d.dataset.idx=i;
      d.innerHTML='<span class="gw-dia">💎</span><span class="gw-lbl">'+lbl+'</span>';
      d.onclick=function(){
        var idx=parseInt(this.dataset.idx);
        var sbi=document.querySelectorAll('.sbi');
        if(sbi[idx])sbi[idx].click();
        bar.querySelectorAll('.gw-hi').forEach(function(el){el.classList.remove('gw-act');});
        this.classList.add('gw-act');
      };
      bar.appendChild(d);
    });
    navbar.insertAdjacentElement('afterend',bar);
  }
  new MutationObserver(function(){if(!document.getElementById('gw-hbar')&&window.innerWidth>768)gwBuildHBar();}).observe(document.body,{childList:true,subtree:false});
  // Dil değişimini güvenli izle
  setInterval(gwRefreshLabels,800);
  setTimeout(gwBuildHBar,500);
  window.addEventListener('resize',function(){gwBuildHBar();});
  // ── YATAY MENÜ SONU v4 ─────────────────────────────────

  // Dil menüsü dışarı tık + Android geri kapama
  var overlay=document.createElement('div');
  overlay.style.cssText='display:none;position:fixed;inset:0;z-index:999;background:transparent;';
  document.body.appendChild(overlay);

  function closeLangMenu(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd){dd.click();}
    overlay.style.display='none';
    window._langOpen=false;
  }

  overlay.addEventListener('click',function(){closeLangMenu();});

  window.addEventListener('popstate',function(){
    if(window._langOpen){closeLangMenu();}
  });

  new MutationObserver(function(){
    var dd=document.querySelector('div[style*="1100"]');
    if(dd&&!window._langOpen){
      window._langOpen=true;
      overlay.style.display='block';
      history.pushState(null,'',location.href);
    } else if(!dd&&window._langOpen){
      window._langOpen=false;
      overlay.style.display='none';
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
