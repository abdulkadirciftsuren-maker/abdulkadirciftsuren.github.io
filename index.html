  function makeOption(code,flag,name,onSelect){
    if(document.getElementById('gw-lang-'+code))return;
    var div=document.createElement('div');
    div.id='gw-lang-'+code;
    div.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;color:#e8e0d0;font-weight:500;font-size:13px;font-family:DM Sans,sans-serif;transition:background 0.15s;';
    div.innerHTML='<span style="font-size:18px;line-height:1;flex-shrink:0">'+flag+'</span><span style="font-weight:800;font-size:11px;min-width:28px">'+code+'</span><span style="font-size:12px;opacity:0.7">'+name+'</span>';
    div.onmouseover=function(){this.style.background='rgba(201,162,39,0.08)';};
    div.onmouseout=function(){this.style.background='transparent';};
    div.onclick=function(e){e.stopPropagation();onSelect();};
    return div;
  }

  function setReactLang(code,dropdown){
    // Hem dropdown hem de children'dan her iki yonle ara
    var elements=[dropdown];
    for(var i=0;i<dropdown.children.length;i++)elements.push(dropdown.children[i]);
    for(var ei=0;ei<elements.length;ei++){
      var el=elements[ei];
      var fk=Object.keys(el).find(function(k){return k.startsWith('__reactFiber')||k.startsWith('__reactInternalInstance');});
      if(!fk)continue;
      var fiber=el[fk];
      var tried=0;
      while(fiber&&tried<1000){
        tried++;
        var st=fiber.memoizedState;
        while(st){
          if(st.queue&&st.queue.dispatch){
            var v=st.memoizedState;
            if(typeof v==='string'&&(v==='TR'||v==='EN'||v==='DE'||v==='ES'||v==='FR'||v==='RU'||v==='UKR')){
              try{st.queue.dispatch(code);return true;}catch(ex){}
            }
          }
          st=st.next;
        }
        fiber=fiber.return;
      }
    }
    return false;
  }

  function addLangsToDropdown(){
    // z-index 1100 olan dropdown'u bul
    var all=document.querySelectorAll('div');
    var dropdown=null;
    for(var i=0;i<all.length;i++){
      if(all[i].style.zIndex==='1100'&&all[i].children.length>=3){
        dropdown=all[i];break;
      }
    }
    if(!dropdown)return;
    var arOpt=makeOption('AR','🇸🇦','العربية',function(){setReactLang('AR',dropdown);});
    var cnOpt=makeOption('CN','🇨🇳','中文',function(){setReactLang('CN',dropdown);});
    if(arOpt)dropdown.appendChild(arOpt);
    if(cnOpt)dropdown.appendChild(cnOpt);
  }

  var obs=new MutationObserver(function(){addLangsToDropdown();});
  obs.observe(document.body,{childList:true,subtree:true});
})();
